[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-router"
version = "0.4.2"
description = "Local, parent-supervised delegation between coding agent CLIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pydantic-settings>=2.10,<3", "tomlkit>=0.13.3,<1", "websockets>=17.1,<18"]

[project.scripts]
router = "router.cli:main"
router-observe = "router.observer_hook:main"
router-host-hook = "router.hooks:main"

[tool.setuptools.packages.find]
include = ["router*"]

[tool.setuptools.package-data]
router = ["plugin/.claude-plugin/*.json", "plugin/hooks/*.json", "plugin/skills/*/*.md", "plugin/hook.sh", "plugin/README.md", "plugin/LICENSE", "dashboard.html"]
