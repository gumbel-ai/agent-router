name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Capacity sampling and process handling have separate Linux and macOS paths.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff==0.17.1

      - name: Lint
        run: ruff check router hooks scripts tests

      - name: Test
        # Leaked files, sockets, or subprocesses fail the run.
        run: python -W error::ResourceWarning -m unittest discover -s tests
